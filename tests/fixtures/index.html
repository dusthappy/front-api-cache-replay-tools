<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>API Cache Replay · 验收页面</title>
<style>body{font:16px/1.65 system-ui,sans-serif;background:#f4f7fa;color:#1d2f40;max-width:850px;margin:60px auto;padding:24px}h1{font-size:28px}nav,section{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}button,a{padding:9px 14px;border:1px solid #b7c8d6;border-radius:6px;background:white;color:#164666;cursor:pointer}pre{background:#fff;border:1px solid #d5dfe6;padding:20px;white-space:pre-wrap;word-break:break-word}p{max-width:70ch}code{color:#075a58}button:focus-visible,a:focus-visible{outline:3px solid #2872c0}</style>
<h1>接口缓存与回放 · 本地验收</h1><p>添加并授权本站后，刷新页面即可开始测试。相同查询首次返回真实响应，再次调用应保留同一个 <code>count</code>；网站、本页和接口默认启用缓存。</p>
<nav><a href="/users">用户页面</a><a href="/orders">订单页面</a><button id="spa">SPA 切换页面</button></nav>
<section><button id="fetch">Fetch 查询</button><button id="xhr">XHR 查询</button><button id="post">POST 查询</button><button id="write">写入操作</button><button id="count">查看后端计数</button></section>
<pre id="result" role="status">等待发起请求…</pre>
<script>
const out = document.querySelector('#result');
const show = data => out.textContent = JSON.stringify(data,null,2);
document.querySelector('#fetch').onclick = async()=>show(await (await fetch('/api/users?page=1&status=active')).json());
document.querySelector('#xhr').onclick=()=>{const xhr=new XMLHttpRequest();xhr.open('GET','/api/orders?page=1');xhr.responseType='json';xhr.onload=()=>show(xhr.response);xhr.send()};
document.querySelector('#post').onclick=async()=>show(await(await fetch('/api/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filter:'active',pagination:{page:1}})})).json());
document.querySelector('#write').onclick=async()=>show(await(await fetch('/api/save',{method:'PUT',body:JSON.stringify({name:'example'}),headers:{'Content-Type':'application/json'}})).json());
document.querySelector('#count').onclick=async()=>show(await(await fetch('/__counts')).json());
document.querySelector('#spa').onclick=()=>history.pushState({},'',location.pathname==='/users'?'/orders':'/users');
</script></html>
